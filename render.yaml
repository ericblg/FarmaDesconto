services:
  - type: web
    name: farmadesconto-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farmadesconto-db
          property: connectionString

databases:
  - name: farmadesconto-db
    databaseName: farmadesconto
    user: farmadesconto_user
    plan: free
